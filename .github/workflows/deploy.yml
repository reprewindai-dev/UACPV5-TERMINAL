name: Deploy Terminal

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.TERMINAL_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.TERMINAL_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      DEPLOY_PATH: ${{ vars.TERMINAL_DEPLOY_PATH }}
      DOCKER_NETWORK: ${{ vars.TERMINAL_DOCKER_NETWORK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "TERMINAL_DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "TERMINAL_DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "HETZNER_SSH_KEY is not configured"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "TERMINAL_DEPLOY_PATH is not configured"; exit 1; }
          test -n "$DOCKER_NETWORK" || { echo "TERMINAL_DOCKER_NETWORK is not configured"; exit 1; }

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/veklom-deploy
          chmod 600 ~/.ssh/veklom-deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull, Build, and Swap
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/veklom-deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP='$DEPLOY_PATH' DOCKER_NETWORK='$DOCKER_NETWORK' SHA='${{ github.sha }}' bash -s" << 'ENDSSH'
          set -euo pipefail
          CONTAINER_NAME=terminal-veklom
          IMAGE_TAG="${SHA:0:7}"
          IMAGE="uacpv5-terminal:${IMAGE_TAG}"

          cd "$APP"
          git fetch origin "$SHA"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"

          echo "--- Building image ---"
          docker build -t "$IMAGE" -t uacpv5-terminal:latest .

          echo "--- Recreating terminal container ---"
          docker stop "$CONTAINER_NAME" >/dev/null 2>&1 || true
          docker rm "$CONTAINER_NAME" >/dev/null 2>&1 || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --network "$DOCKER_NETWORK" \
            --restart unless-stopped \
            -e PORT=80 \
            -w /app \
            --label traefik.enable=true \
            --label "traefik.http.routers.terminal-veklom-http.entrypoints=http" \
            --label "traefik.http.routers.terminal-veklom-http.rule=Host(\`terminal.veklom.com\`)" \
            --label "traefik.http.routers.terminal-veklom-https.entrypoints=https" \
            --label "traefik.http.routers.terminal-veklom-https.rule=Host(\`terminal.veklom.com\`)" \
            --label "traefik.http.routers.terminal-veklom-https.tls=true" \
            --label "traefik.http.routers.terminal-veklom-https.tls.certresolver=letsencrypt" \
            --label "traefik.http.services.terminal-veklom.loadbalancer.server.port=80" \
            "$IMAGE" \
            npm run start

          echo "--- Waiting for container health ---"
          sleep 5
          STATUS=$(docker inspect "$CONTAINER_NAME" --format '{{.State.Status}}')
          if [ "$STATUS" = "running" ]; then
            echo "$CONTAINER_NAME is running successfully"
          else
            echo "Container failed to start. Status: $STATUS"
            exit 1
          fi
          ENDSSH

      - name: Verify Production Health
        run: |
          sleep 10
          for i in 1 2 3 4; do
            HTTP=$(curl -sk https://terminal.veklom.com -o /dev/null -w '%{http_code}')
            if [ "$HTTP" = "200" ]; then
              echo "terminal.veklom.com returned HTTP 200 (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: got $HTTP, retrying..."
            sleep 5
          done
          echo "HEALTH CHECK FAILED after 4 attempts"
          exit 1
